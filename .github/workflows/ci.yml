name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit for generated release metadata checks'
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '22.19.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: install native search dependency
        run: node tools/release/ci-ripgrep.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Check OpenTUI image frames in a PTY
        if: matrix.node == '26'
        run: npm run visual:opentui-ghost
      - name: Prepare the terminal bench browser
        if: matrix.node == '26'
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "playwright"; const browser=await chromium.launch({headless:true}); try { const page=await browser.newPage(); await page.goto("about:blank"); console.log("Browser ready:",browser.version()); } finally { await browser.close(); }'
      - name: Check actual OpenTUI settings and session flows
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-app
      - name: Check actual OpenTUI plugin management and placement
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-managers
      - name: Check stable OpenTUI window navigation
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-navigation
      - name: Check independent OpenTUI command cancellation
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-cancellation
      - name: Check independent OpenTUI human input windows
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-requests
      - name: Check selected OpenTUI private controllers
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-controllers
      - name: Check selected OpenTUI editor ownership and lifecycle
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-editor
      - name: Check selected OpenTUI history and placement windows
        if: matrix.node == '26'
        timeout-minutes: 7
        run: npm run visual:opentui-workspace-controllers
      - if: matrix.node == '26'
        run: npm run marketplace:validate
      - if: matrix.node == '26'
        run: npm run plugin:schema -- --check
      - name: Certify every plugin against its mandatory deterministic matrix
        if: matrix.node == '26'
        run: npm run plugin:certify -- --all
      - name: Verify independent plugin version changes
        if: matrix.node == '26'
        env:
          PLUGIN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
          PLUGIN_RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$PLUGIN_BASE_SHA" ] && [ "$PLUGIN_BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            if [ "$PLUGIN_RELEASE_BRANCH" = 'automation/plugin-releases' ]; then
              npm run plugin:changed -- "$PLUGIN_BASE_SHA" --strict
            else
              npm run plugin:changed -- "$PLUGIN_BASE_SHA"
            fi
          fi
      - if: matrix.node == '26'
        run: npm run eval -- --output dist/evals-ci
      - if: matrix.node == '26'
        run: npm run eval:tools -- --output dist/evals-tools-ci
      - if: matrix.node == '26'
        run: npm run eval:proxy
      - name: preserve quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-node-${{ matrix.node }}
          path: |
            reports/junit.xml
            reports/coverage/coverage.xml
            reports/certification/
            dist/visual-opentui-ghost/report.json
            dist/visual-opentui-app/
            dist/visual-opentui-managers/
            dist/visual-opentui-navigation/
            dist/visual-opentui-cancellation/
            dist/visual-opentui-requests/
            dist/visual-opentui-controllers/
            dist/visual-opentui-editor/
            dist/visual-opentui-workspace-controllers/
            dist/evals-ci/
            dist/evals-tools-ci/
          if-no-files-found: warn
      # Neovim api-metadata pattern: generated artifacts are committed,
      # CI fails if docs/events.md or schema/events.json drift from source.
      - if: matrix.node == '26'
        run: npm run gen
      - name: check generated docs are in sync
        if: matrix.node == '26'
        run: |
          git diff --exit-code docs/events.md schema/events.json \
            || { echo "run 'npm run gen' and commit the result"; exit 1; }
