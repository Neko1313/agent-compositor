name: plugin-release-preparation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - name: Prepare independent versions and changelogs from committed changes
        id: plan
        run: |
          npm run plugin:prepare -- --write
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate matching catalog documentation
        if: steps.plan.outputs.changed == 'true'
        run: |
          npm run docs:gen
          npm run marketplace:validate
      - name: Create or refresh the release pull request and run its checks
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.plan.outputs.base }}
          RELEASE_BRANCH: automation/plugin-releases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$RELEASE_BRANCH"
          git add -- .plugin-release.json .claude-plugin/marketplace.json plugins/*/plugin.json plugins/*/CHANGELOG.md docs/reference/plugins.md
          git commit -m 'chore(release): prepare plugin versions'
          git push --force-with-lease origin "HEAD:refs/heads/$RELEASE_BRANCH"
          cat > "$RUNNER_TEMP/plugin-release-body.md" <<'BODY'
          Prepare independent plugin versions and changelog entries from committed runtime changes. Development catalog entries and the generated plugin reference are synchronized; published archive entries remain pinned to certified releases.

          Conventional commits select patch/minor/major versions. Bundled workspace inputs and packaging changes are included. No archives or tags are published by this pull request; the existing release certification gates still apply.

          CI and documentation checks are explicitly dispatched for this commit because events created with GITHUB_TOKEN do not trigger them automatically.
          BODY
          NUMBER=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title 'chore(release): prepare plugin versions' --body-file "$RUNNER_TEMP/plugin-release-body.md"
          else
            gh pr create --head "$RELEASE_BRANCH" --base main --title 'chore(release): prepare plugin versions' --body-file "$RUNNER_TEMP/plugin-release-body.md"
          fi
          gh workflow run ci.yml --ref "$RELEASE_BRANCH" -f "base_ref=$RELEASE_BASE_SHA"
          gh workflow run docs.yml --ref "$RELEASE_BRANCH"
