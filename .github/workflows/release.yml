name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run marketplace:validate
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality
          path: |
            reports/junit.xml
            reports/coverage.xml

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - name: Build native release bundle
        run: npm run build:release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Verify archive, install, default plugins and model request
        run: npm run release:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/release/compositor-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/release
          merge-multiple: true
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current --strip header --output RELEASE_NOTES.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cp install.sh dist/release/install.sh
          cd dist/release
          sha256sum compositor-*.tar.gz install.sh > SHA256SUMS
          # Keep partial uploads hidden until all assets are present.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ../../RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" compositor-*.tar.gz install.sh SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
