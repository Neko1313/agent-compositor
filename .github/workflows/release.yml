name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish after verification (blank builds only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install native search dependency
        run: node tools/release/ci-ripgrep.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run marketplace:validate
      - name: Require every bundled plugin deterministic contract
        run: npm run plugin:certify -- --all
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality
          path: |
            reports/junit.xml
            reports/coverage/coverage.xml
            reports/certification/

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - name: Build native release bundle
        run: npm run build:release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
      - name: Verify archive, install, default plugins and model request
        run: npm run release:smoke
      - name: Prepare the terminal bench browser
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "playwright"; const browser=await chromium.launch({headless:true}); try { const page=await browser.newPage(); await page.goto("about:blank"); console.log("Browser ready:",browser.version()); } finally { await browser.close(); }'
      - name: Verify relocated OpenTUI application flow
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-app-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-app
      - name: Verify relocated OpenTUI plugin management and placement
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-managers-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-managers
      - name: Verify relocated OpenTUI window navigation
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-navigation-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-navigation
      - name: Verify relocated OpenTUI command cancellation
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-cancellation-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-cancellation
      - name: Verify relocated OpenTUI human input windows
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-requests-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-requests
      - name: Verify relocated OpenTUI selected private controllers
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-controllers-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-controllers
      - name: Check the relocated native selected OpenTUI editor
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-editor-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-editor
      - name: Check relocated native selected history and placement windows
        timeout-minutes: 7
        shell: bash
        env:
          VISUAL_OUTPUT: dist/release/opentui-workspace-controllers-${{ matrix.platform }}
        run: |
          OPENTUI_INSTALL_DIR="$(mktemp -d "$RUNNER_TEMP/opentui-native.XXXXXX")"
          trap 'rm -rf "$OPENTUI_INSTALL_DIR"' EXIT
          tar -xzf "dist/release/compositor-${{ matrix.platform }}.tar.gz" -C "$OPENTUI_INSTALL_DIR"
          VISUAL_EXECUTABLE="$OPENTUI_INSTALL_DIR/compositor/compositor" npm run visual:opentui-workspace-controllers
      - name: Preserve installed-runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-runtime-${{ matrix.platform }}
          path: |
            dist/release/*smoke-*.json
            dist/release/opentui-app-${{ matrix.platform }}/
            dist/release/opentui-managers-${{ matrix.platform }}/
            dist/release/opentui-navigation-${{ matrix.platform }}/
            dist/release/opentui-cancellation-${{ matrix.platform }}/
            dist/release/opentui-requests-${{ matrix.platform }}/
            dist/release/opentui-controllers-${{ matrix.platform }}/
            dist/release/opentui-editor-${{ matrix.platform }}/
            dist/release/opentui-workspace-controllers-${{ matrix.platform }}/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: dist/release/compositor-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(jq -r .version package.json)"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          # A fixed release pipeline may rebuild an existing unpublished tag.
          # Only CI configuration and smoke fixtures may differ from its source.
          git diff --exit-code "$RELEASE_TAG" "$GITHUB_SHA" -- . \
            ':!.github/workflows/release.yml' ':!tools/release/smoke.mjs'
          git checkout --detach "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist/release
          merge-multiple: true
          digest-mismatch: error
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current --strip header --output RELEASE_NOTES.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          cp install.sh dist/release/install.sh
          cd dist/release
          sha256sum compositor-*.tar.gz install.sh > SHA256SUMS
          # Keep partial uploads hidden until all assets are present.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ../../RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" compositor-*.tar.gz install.sh SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
